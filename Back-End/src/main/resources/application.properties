spring.application.name=TASTYCUISINE
server.port=8080

# Configura��es do banco SQL Server hospedado no Somee
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=TASTYCUISINE;integratedSecurity=false;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=@ITB123456
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configura��es do JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
server.error.include-message=always
server.error.include-stacktrace=always

# JWT settings
jwt.secret=change-me-secret-key-please-use-strong-one
jwt.expiration-ms=86400000


